services:
  aritman:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aritman-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/aritman.db
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET tanimlanmali}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://aritman.com.tr}
    volumes:
      - ./data:/app/data
      - ./media:/app/media
